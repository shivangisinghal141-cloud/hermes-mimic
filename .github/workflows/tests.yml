name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed to compare plugin.yaml with the latest release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check plugin.yaml version against the latest tag
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' plugin.yaml | tr -d '"' | head -n 1 | tr -d '[:space:]')"
          LATEST="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          echo "plugin.yaml : $VERSION"
          echo "latest tag  : ${LATEST:-<none>}"
          if [ -z "$VERSION" ]; then
            echo "::error::no version: line found in plugin.yaml"
            exit 1
          fi
          if [ -z "$LATEST" ]; then
            echo "no v* tag yet - nothing to compare"
            exit 0
          fi
          if [ "$LATEST" != "v$VERSION" ]; then
            echo "::error::plugin.yaml says $VERSION but the latest tag is $LATEST - tag the new version or bump plugin.yaml"
            exit 1
          fi
          echo "aligned: plugin.yaml $VERSION == $LATEST"

      - name: Install plugin runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.40" pytest

      - name: Install Chromium for the end-to-end test
        run: python -m playwright install --with-deps chromium

      - name: Check the plugin loads and registers its tools
        run: |
          python - <<'PY'
          import importlib.util, sys
          from pathlib import Path

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              "mimic", root / "__init__.py", submodule_search_locations=[str(root)]
          )
          module = importlib.util.module_from_spec(spec)
          sys.modules["mimic"] = module
          spec.loader.exec_module(module)

          tools = module.CORE_TOOLS
          assert len(tools) == 7, tools
          assert callable(module.register)
          print("loaded mimic, tools:", sorted(tools))
          PY

      - name: Build the plugin zip
        run: |
          VERSION="$(python -c "import re,pathlib;print(re.search(r'^version:\s*(\S+)',pathlib.Path('plugin.yaml').read_text(),re.M).group(1))")"
          mkdir -p dist
          git archive --format=zip --prefix="mimic-${VERSION}/" -o "dist/mimic-${VERSION}.zip" HEAD
          echo "ZIP=dist/mimic-${VERSION}.zip" >> "$GITHUB_ENV"
          ls -lh "dist/mimic-${VERSION}.zip"

      - name: Upload the plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: mimic-plugin-zip
          path: ${{ env.ZIP }}
          if-no-files-found: error
          retention-days: 14

      - name: Run the test suite
        run: python -m pytest -q
