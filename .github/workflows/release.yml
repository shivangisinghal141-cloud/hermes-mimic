name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches plugin.yaml
        run: |
          python - <<'PY'
          import os, re, sys
          from pathlib import Path

          version = re.search(
              r"^version:\s*(\S+)\s*$", Path("plugin.yaml").read_text(), re.M
          ).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          wanted = "v" + version
          print(f"plugin.yaml: {version}  tag: {tag}")
          if tag != wanted:
              sys.exit(f"tag {tag} does not match plugin.yaml version {version} (expected {wanted})")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.40" pytest

      - name: Run the suite (browser test excluded)
        run: python -m pytest -q --ignore=tests/test_e2e.py

      - name: Build the plugin zip
        run: |
          VERSION="$(python -c "import re,pathlib;print(re.search(r'^version:\s*(\S+)',pathlib.Path('plugin.yaml').read_text(),re.M).group(1))")"
          mkdir -p dist
          git archive --format=zip --prefix="mimic-${VERSION}/" -o "dist/mimic-${VERSION}.zip" HEAD
          unzip -l "dist/mimic-${VERSION}.zip" | tail -3
          echo "ZIP=dist/mimic-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
